services:
  python-provider:
    build: 
      context: ./PythonProvider
    ports:
      - "8000:8000"
    restart: always

  core-backend:
    build: 
      context: ./CoreBackend
    ports:
      - "5000:8080" # Внешний порт 5000, внутренний 8080 для .NET 10
    depends_on:
      - python-provider
    restart: always
